services:
  client:
    build:
      context: ./client
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./client:/app
      - node_modules:/app/node_modules
    ports:
      - '3000:3000'
    depends_on:
      - server

  server:
    build:
      context: ./server
    volumes:
      - ./server:/usr/src/app
      - server_target:/usr/src/app/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    ports:
      - '8000:8000'

volumes:
  node_modules:
  server_target:
  cargo_registry:
  cargo_git:
