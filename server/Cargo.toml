[package]
name = "rotation-server"
version = "0.1.0"
homepage = "https://github.com/justinroche"
edition = "2024"

[dependencies]
axum = "0.8.4"
serde_json = "1.0.143"
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15.7"
once_cell = "1.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
